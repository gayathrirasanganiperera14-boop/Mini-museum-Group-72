<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Museum AR</title>

  <!-- A-Frame must load BEFORE AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // Component 1: tap an object to change its colour (from the workshop)
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;
          this.el.setAttribute('color', colors[index]);
        });
      }
    });

    // Component 2 (MY OWN): tap an object to grow it, tap again to shrink it
    AFRAME.registerComponent('tap-grow', {
      init: function () {
        let big = false;
        this.el.addEventListener('click', () => {
          big = !big;
          this.el.setAttribute('scale', big ? '1.8 1.8 1.8' : '1 1 1');
        });
      }
    });

    // Component 3: status banner changes when the marker is found / lost
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Welcome to the museum! Tap the ball and the cone.';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Exhibit lost - point the camera at the Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 10px; text-align: center; color: white;
      font-family: sans-serif; background: #C62828;
    }
  </style>
</head>

<body>
  <div id="status">Looking for the museum marker...</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Model file sits next to index.html. Rename here if your file name is different -->
    <a-assets timeout="60000">
      <a-asset-item id="exhibit-model" src="exhibit.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>

      <!-- 1. Back wall (box) -->
      <a-box position="0 0.5 -0.8" width="1.8" height="1" depth="0.05"
             color="#F5E6CC"></a-box>

      <!-- 2. Two wall paintings (box frame + plane picture) -->
      <a-box position="-0.45 0.7 -0.76" width="0.45" height="0.34" depth="0.03"
             color="#5D4037"></a-box>
      <a-plane position="-0.45 0.7 -0.74" width="0.38" height="0.27"
               color="#4CC3D9"></a-plane>
      <a-box position="0.45 0.7 -0.76" width="0.45" height="0.34" depth="0.03"
             color="#5D4037"></a-box>
      <a-plane position="0.45 0.7 -0.74" width="0.38" height="0.27"
               color="#FFC65D"></a-plane>

      <!-- 3. Two side pillars (cylinders) -->
      <a-cylinder position="-0.8 0.4 -0.65" radius="0.08" height="0.8"
                  color="#BDBDBD"></a-cylinder>
      <a-cylinder position="0.8 0.4 -0.65" radius="0.08" height="0.8"
                  color="#BDBDBD"></a-cylinder>

      <!-- 4. LEFT EXHIBIT: stand (cylinder, pulses = animation on SCALE) -->
      <a-cylinder position="-0.45 0.1 0" radius="0.25" height="0.2" color="#8D6E63"
                  animation="property: scale; from: 1 1 1; to: 1.1 1 1.1;
                             dir: alternate; dur: 1200; loop: true"></a-cylinder>

      <!-- 5. Your glTF model (spins = animation on ROTATION) -->
      <a-entity gltf-model="#exhibit-model" position="-0.45 0.2 0" scale="0.4 0.4 0.4"
                animation="property: rotation; to: 0 360 0; dur: 8000;
                           easing: linear; loop: true"></a-entity>

      <!-- 6. RIGHT EXHIBIT: dinosaur platform (box) -->
      <a-box position="0.35 0.05 0" width="0.8" height="0.1" depth="0.5"
             color="#6D4C41"></a-box>

      <!-- 7. DINOSAUR built from simple shapes (faces right) -->
      <a-entity position="0.42 0.1 0" scale="0.65 0.65 0.65">
        <!-- body -->
        <a-sphere position="0 0.28 0" radius="0.15" scale="1.5 1 1" color="#4CAF50"></a-sphere>
        <!-- legs -->
        <a-cylinder position="-0.06 0.09 0.07" radius="0.035" height="0.18" color="#388E3C"></a-cylinder>
        <a-cylinder position="-0.06 0.09 -0.07" radius="0.035" height="0.18" color="#388E3C"></a-cylinder>
        <a-cylinder position="0.09 0.09 0.07" radius="0.035" height="0.18" color="#388E3C"></a-cylinder>
        <a-cylinder position="0.09 0.09 -0.07" radius="0.035" height="0.18" color="#388E3C"></a-cylinder>
        <!-- neck -->
        <a-cylinder position="0.2 0.42 0" rotation="0 0 -30" radius="0.05" height="0.25"
                    color="#4CAF50"></a-cylinder>
        <!-- head -->
        <a-sphere position="0.31 0.55 0" radius="0.08" scale="1.4 0.9 0.9" color="#4CAF50"></a-sphere>
        <!-- eyes -->
        <a-sphere position="0.34 0.58 0.06" radius="0.015" color="#000000"></a-sphere>
        <a-sphere position="0.34 0.58 -0.06" radius="0.015" color="#000000"></a-sphere>
        <!-- tail -->
        <a-cone position="-0.405 0.27 0" rotation="0 0 95" radius-bottom="0.1" radius-top="0"
                height="0.45" color="#388E3C"></a-cone>
      </a-entity>

      <!-- 8. Highlight ball (sphere) - TAP to change colour; bounces = animation on POSITION -->
      <a-sphere class="clickable" color-changer
                position="0 0.5 0.35" radius="0.12" color="#EF2D5E"
                animation="property: position; from: 0 0.4 0.35; to: 0 0.7 0.35;
                           dir: alternate; dur: 700; easing: easeInOutQuad;
                           loop: true"></a-sphere>

      <!-- 9. Information pin (cone, point down) - TAP to grow / shrink -->
      <a-cone class="clickable" tap-grow
              position="-0.75 0.5 0.45" rotation="180 0 0"
              radius-bottom="0.12" radius-top="0" height="0.3"
              color="#FFC65D"></a-cone>

      <!-- 10. Name plaque in front (box) -->
      <a-box position="0 0.1 0.6" width="0.8" height="0.2" depth="0.05"
             color="#2C3E50"></a-box>

      <!-- 11. Rope barrier: two posts + rope -->
      <a-cylinder position="-0.85 0.15 0.9" radius="0.025" height="0.3" color="#FFD54F"></a-cylinder>
      <a-cylinder position="0.85 0.15 0.9" radius="0.025" height="0.3" color="#FFD54F"></a-cylinder>
      <a-box position="0 0.26 0.9" width="1.7" height="0.02" depth="0.02"
             color="#B71C1C"></a-box>

      <!-- 12. Museum title (a-text) -->
      <a-text value="MINI MUSEUM" position="0 1.5 0" align="center"
              width="3" color="#FFFFFF"></a-text>

      <!-- 13. Exhibit label (a-text) - change this to your model's name -->
      <a-text value="Exhibit: My 3D Model" position="-0.45 0.85 0" align="center"
              width="1.4" color="#FFC65D"></a-text>

      <!-- 14. Dinosaur label (a-text) -->
      <a-text value="T-Rex Hall" position="0.4 0.75 0" align="center"
              width="1.4" color="#A5D6A7"></a-text>
    </a-marker>

    <!-- Camera + tap detection -->
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
